name: EAS Android Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install eas-cli
        run: npm install -g eas-cli
      - name: Install dependencies
        run: |
          if [ -f pnpm-lock.yaml ]; then
            corepack enable
            pnpm install --frozen-lockfile
          elif [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi
      - name: Build AAB on EAS
        run: eas build --platform android --profile production --non-interactive --wait --json > build.json
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      - name: Download AAB artifact
        run: |
          BUILD_URL=$(node -e "const b=JSON.parse(require('fs').readFileSync('build.json','utf8')); const build=Array.isArray(b)?b[0]:b; console.log(build.artifacts.buildUrl)")
          curl -L --fail --retry 3 -o app-release.aab "$BUILD_URL"
          ls -lh app-release.aab
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: app-release.aab
          if-no-files-found: error
      - name: Publish AAB to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: aab-build-${{ github.run_number }}
          name: AAB build ${{ github.run_number }} (SDK 54 / API 36)
          files: app-release.aab
